[package]
name = "server"
version = "0.1.0"
edition = "2024"

[dependencies]
rustls = "0.23"
rustls-pemfile = "2"
common = { path = "../common" }
scrap = "0.5"
image = "0.24"
lz4_flex = "0.11"
objc = "0.2"
turbojpeg = "1.3"
openh264 = "0.4"

[build-dependencies]
cc = "1.0"

[target.'cfg(target_os = "linux")'.dependencies]
xcap = "0.2"
ashpd = { version = "0.4.0-alpha.4", default-features = false, features = ["tokio"] }
pipewire = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.23"